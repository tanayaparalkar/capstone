name: SentinelAI Nightly

# Everything the pull-request workflow deliberately leaves out, moved off the
# commit path rather than added to it.
#
# ci.yml stays exactly as it is - one job, core tier, no extra tools - because
# it runs on every push and pull request, and because tests/test_ci_workflow.py
# pins its shape (one job, no secrets, no job-level env). The expensive
# verification lives here instead: the extended tier needs two more scanner
# binaries and reaches the network, the benchmark-marked tests shell out to real
# scanners, and the Python matrix costs three times the install work. None of
# that belongs in front of a reviewer waiting on a PR.
#
# Nothing here changes SentinelAI. Every step drives the installed CLI or the
# existing pytest markers.

"on":
  schedule:
    # 03:30 UTC daily - after most contributors have stopped pushing, so a
    # failure is attributable to the day's merges rather than to a race with
    # them. GitHub does not guarantee the minute; drift is acceptable here.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The compatibility gap ci.yml cannot close: pyproject declares
  # requires-python = ">=3.9" while the PR job only ever runs 3.12. This matrix
  # is the only thing verifying the floor is real.
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinelai-cli
    strategy:
      # One version failing must not hide the others - the whole point is to
      # learn which end of the supported range broke.
      fail-fast: false
      matrix:
        # The declared floor, and the version CI and the container both use.
        # 3.10/3.11 are omitted deliberately: they add runtime without adding
        # information the two endpoints do not already give.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sentinelai-cli/pyproject.toml

      - name: Install SentinelAI CLI
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

  # ---------------------------------------------------------------------------
  # The Dockerfile is verified by 34 tests in test_docker_packaging.py, but every
  # one of them reads the file as text - pinned versions, checksum verification,
  # the non-root user, the read-only mount. None of them proves the image
  # actually builds. A stale base tag, a moved scanner release URL or a changed
  # upstream checksum would all pass those tests and fail only when a user ran
  # `docker build`, which nothing in this repository did automatically.
  #
  # Build only: nothing is pushed, tagged for a registry, or uploaded. The
  # Dockerfile is used exactly as committed.
  #
  # A separate job rather than a step in extended-tier below, so the ~5-10
  # minutes of scanner downloads run in parallel with the scans instead of
  # adding to them, and so a build failure is attributable at a glance.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Plain `docker build`, not a build-push action: the runner already has
      # Docker, nothing needs pushing, and adding a third-party action here
      # would be a dependency for no capability this job uses.
      - name: Build the image from the committed Dockerfile
        run: docker build -t sentinelai:ci-verify .

      # Confirms the build produced an image rather than silently no-op'ing.
      # Deliberately not a scan: whether the CLI runs correctly in the container
      # is the extended-tier job's concern, and duplicating it here would double
      # the nightly cost for a second copy of the same answer.
      - name: Confirm the image exists
        run: docker image inspect sentinelai:ci-verify --format '{{.Id}} {{.Size}} bytes'

  # ---------------------------------------------------------------------------
  # Extended tier: the capability the paper and README both record as
  # unexercised by CI. Needs Trivy and OSV-Scanner, which ci.yml deliberately
  # does not install.
  # ---------------------------------------------------------------------------
  extended-tier:
    name: Extended tier, benchmarks and patching
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinelai-cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sentinelai-cli/pyproject.toml

      - name: Install SentinelAI CLI
        run: python -m pip install -e ".[dev]"

      # Same pinned versions as the Dockerfile and ci.yml. Pinned, not "latest",
      # for the reason ci.yml already gives: a new release must never silently
      # change what this job verifies.
      - name: Install all five scanners
        env:
          GITLEAKS_VERSION: "8.30.1"
          TRIVY_VERSION: "0.74.0"
          OSV_SCANNER_VERSION: "2.5.1"
        run: |
          python -m pip install semgrep==1.172.0 bandit==1.9.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/gitleaks && rm gitleaks.tar.gz
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          tar -xzf trivy.tar.gz trivy && sudo mv trivy /usr/local/bin/trivy && rm trivy.tar.gz
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner && sudo mv osv-scanner /usr/local/bin/osv-scanner
          semgrep --version && bandit --version && gitleaks version
          trivy --version && osv-scanner --version

      # Trivy downloads a ~108 MB vulnerability database on first use. Caching it
      # saves that download, and the key rotates weekly so the cache cannot make
      # this job test an indefinitely stale database.
      - name: Cache Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Semgrep caches downloaded rule bundles here. Same reasoning: it changes
      # how fast rules are fetched, never which rules are applied.
      - name: Cache Semgrep rules
        uses: actions/cache@v4
        with:
          path: ~/.cache/semgrep
          key: semgrep-${{ runner.os }}-1.172.0

      # The 9 benchmark-marked tests: real scanners against the committed
      # fixture, the recursive OSV manifest-discovery guards, and the
      # whole-chain integration test. Excluded from the default run by
      # pyproject's addopts, so this is the only place they execute.
      - name: Run benchmark-marked tests (real scanners)
        run: pytest -q -m benchmark -v

      - name: Core-tier scan
        run: sentinelai scan ../sentinelai-manual-test --format json --output core.json

      - name: Extended-tier scan (Trivy + OSV-Scanner)
        run: sentinelai scan ../sentinelai-manual-test --extended --format json --output extended.json

      # Determinism is asserted by unit tests at every layer; this checks it
      # survives two complete CLI invocations, which no test can do.
      - name: Verify repeated scans are deterministic
        run: |
          sentinelai scan ../sentinelai-manual-test --format json --output repeat.json
          python - <<'PY'
          import json
          a = json.load(open("core.json")); b = json.load(open("repeat.json"))
          ids = lambda d: ([f["finding_id"] for f in d["findings"]["scanner"]],
                           [c["correlation_id"] for c in d["findings"]["correlated"]])
          assert ids(a) == ids(b), "identifiers changed between identical scans"
          print("deterministic: identical finding and correlation identifiers")
          PY

      # Re-rendering a saved report must not re-scan. Verified here by rendering
      # every other format from the saved JSON.
      - name: Verify report reload re-renders without re-scanning
        run: |
          for fmt in markdown html sarif; do
            sentinelai report extended.json --format "$fmt" --output "reloaded.$fmt"
          done

      # Patching runs against a COPY. The workflow must never modify the
      # checked-out fixture, or the determinism check above would be scanning
      # different content on a later run.
      - name: Verify dry-run leaves the repository untouched
        run: |
          cp -r ../sentinelai-manual-test /tmp/fixture-dry
          before=$(find /tmp/fixture-dry -type f -exec sha256sum {} \; | sort | sha256sum)
          sentinelai scan /tmp/fixture-dry --apply-patches --dry-run --no-ai --format json --output dryrun.json
          after=$(find /tmp/fixture-dry -type f -exec sha256sum {} \; | sort | sha256sum)
          test "$before" = "$after" || { echo "dry run modified the repository"; exit 1; }
          test ! -d /tmp/fixture-dry/.sentinelai || { echo "dry run wrote a backup"; exit 1; }
          echo "dry run: repository byte-identical, no backup written"

      - name: Upload scan reports and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: |
            sentinelai-cli/core.json
            sentinelai-cli/extended.json
            sentinelai-cli/repeat.json
            sentinelai-cli/dryrun.json
            sentinelai-cli/reloaded.*
          if-no-files-found: warn
