name: SentinelAI CI

# Runs the SentinelAI CLI's own test suite, then runs SentinelAI against
# this repository as a live demonstration of the DevSecOps security-gate
# workflow: scan once, save the result, generate SARIF + HTML from that
# saved result (never re-scanning), enforce a --fail-on threshold, and
# preserve all reports as artifacts regardless of outcome.
#
# Uses only MockFindingsProvider (the bundled sample dataset) - no
# external scanner, LLM, or database API, and therefore no secrets or
# API keys of any kind. See sentinelai-cli/README.md's "CI/CD
# Integration" section for the equivalent commands to run locally.

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    name: Test and scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinelai-cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Dependencies come from pyproject.toml's own [project] and
      # [project.optional-dependencies].dev tables - nothing is
      # duplicated into this workflow.
      - name: Install SentinelAI CLI
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

      # SentinelAI's own --fail-on threshold can legitimately exit 1
      # (SECURITY_FINDINGS). That must not be treated as a broken CI
      # step, so the exit code is captured explicitly rather than
      # letting the shell step fail outright - it's interpreted in the
      # "Evaluate SentinelAI result" step below, after reports are
      # generated and uploaded.
      - name: Run SentinelAI scan (JSON snapshot + security gate)
        id: sentinelai_scan
        run: |
          set +e
          sentinelai scan . --format json --output scan-result.json --fail-on high
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Exit codes 0 (success) and 1 (security findings) both mean the
      # scan itself completed and scan-result.json was written - see
      # sentinelai/core/exit_codes.py. Only in those cases is there a
      # saved result to generate further reports from. Codes 2-4 mean
      # the scan didn't complete; report generation is skipped and the
      # final step below fails the job as a tool error.
      - name: Generate SARIF report from saved scan result
        if: fromJSON(steps.sentinelai_scan.outputs.exit_code) < 2
        run: sentinelai report scan-result.json --format sarif --output sentinelai-results.sarif

      - name: Generate HTML report from saved scan result
        if: fromJSON(steps.sentinelai_scan.outputs.exit_code) < 2
        run: sentinelai report scan-result.json --format html --output sentinelai-report.html

      # Always upload whatever reports exist, even if the scan or a
      # later step failed - a security-gate failure or a tool failure
      # is exactly when the evidence matters most.
      - name: Upload SentinelAI security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelai-security-reports
          path: |
            sentinelai-cli/scan-result.json
            sentinelai-cli/sentinelai-results.sarif
            sentinelai-cli/sentinelai-report.html
          if-no-files-found: warn

      - name: Evaluate SentinelAI result
        run: |
          code="${{ steps.sentinelai_scan.outputs.exit_code }}"
          if [ "$code" = "0" ]; then
            echo "SentinelAI: scan succeeded, no findings crossed the --fail-on threshold."
          elif [ "$code" = "1" ]; then
            echo "SentinelAI: SECURITY GATE FAILED - findings at or above 'high' severity were found."
            echo "This is a security policy outcome, not a tool failure. See the uploaded reports."
            exit 1
          elif [ "$code" = "2" ]; then
            echo "SentinelAI: INVALID INPUT - the scan command itself was misconfigured. This is a tool/workflow bug, not a security finding."
            exit 1
          elif [ "$code" = "3" ]; then
            echo "SentinelAI: PROVIDER ERROR - the findings provider failed to produce a scan result. This is a tool/integration failure, not a security finding."
            exit 1
          else
            echo "SentinelAI: INTERNAL ERROR (exit code $code) - an unexpected failure inside SentinelAI itself. This is a tool bug, not a security finding."
            exit 1
          fi
