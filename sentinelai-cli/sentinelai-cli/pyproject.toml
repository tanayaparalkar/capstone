[project]
name = "sentinelai-cli"
version = "0.1.0"
description = "SentinelAI CLI - AI-Powered Vulnerability Detection for DevSecOps"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
]

[project.scripts]
sentinelai = "sentinelai.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinelai*"]

[tool.setuptools.package-data]
sentinelai = ["mock_findings.json"]
